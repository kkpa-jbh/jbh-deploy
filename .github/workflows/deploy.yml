# Deploys or rolls back one service on the VPS, then waits until it is healthy (ci-deploy.sh).
# deploy: newest image; if it is not healthy, the VPS goes back to the image from before by itself.
# rollback: the image that ran before the last deploy.
# Started by hand (Actions → Deploy → Run workflow), or by jbh-app's Image workflow with a tag (CI.md, "Auto-deploy").
name: Deploy
run-name: ${{ inputs.action }} ${{ inputs.service }} ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy = newest image. rollback = the image from before the last deploy.
        type: choice
        default: deploy
        options:
          - deploy
          - rollback
      service:
        description: Service
        type: choice
        # Keep in sync with the list in ci-deploy.sh. That list is the real check.
        options:
          - jbh-web
          - jbh-gateway
          - jbh-iam
          - jbh-personal-finance
      tag:
        description: Optional, deploy only. Full git SHA of the image. Empty = the tag in .env on the VPS (latest).
        type: string
        default: ''

# The job only opens an SSH connection. It needs no access to the repo.
permissions: {}

# One run per service at a time; a second run for the same service waits.
# GitHub keeps only one waiting run per group: a newer one replaces it, so the newest image wins.
# One group per service, so a waiting deploy of one service never cancels another service's deploy.
concurrency:
  group: deploy-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pull + up to 3 minutes for health + up to 3 more for an automatic rollback.
    timeout-minutes: 15
    steps:
      # The key can run only ci-deploy.sh on the VPS (forced command), whatever command we send.
      # Plain ssh, no third-party action: the secrets go to no other code.
      - name: ${{ inputs.action }} ${{ inputs.service }}
        env:
          ACTION: ${{ inputs.action }}
          SERVICE: ${{ inputs.service }}
          TAG: ${{ inputs.tag }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "magus@$VPS_HOST" "$ACTION $SERVICE${TAG:+ $TAG}"
