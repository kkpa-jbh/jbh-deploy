# Deployment: tells Kubernetes "keep N copies (pods) of this container running".
# If a pod dies, Kubernetes starts a new one. A new image tag makes it replace the pods one by one (a rollout).
#
# This file is the fully commented example. The other services' deployment.yaml files follow the same shape.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jbh-iam
  labels:
    app.kubernetes.io/name: jbh-iam
spec:
  # One copy. More copies need shared state first: the IAM user cache and the scheduled token cleanup
  # live in each pod (see JBH-88). An overlay may change this number.
  replicas: 1
  # Which pods belong to this Deployment: the ones with this label (set in the template below).
  selector:
    matchLabels:
      app.kubernetes.io/name: jbh-iam
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jbh-iam
    spec:
      # The pod never calls the Kubernetes API, so it gets no API token.
      automountServiceAccountToken: false
      # Kubernetes would add env vars like JBH_GATEWAY_PORT=tcp://... for every Service in the namespace.
      # Spring would read them as properties (jbh.gateway.port). Turned off: we use DNS names instead.
      enableServiceLinks: false
      # Pod-level security, required by the "restricted" Pod Security Standard (namespace.yaml).
      securityContext:
        runAsNonRoot: true
        # The numeric user and group of the image (Dockerfile: USER 10001:10001).
        runAsUser: 10001
        runAsGroup: 10001
        # Files in mounted volumes (emptyDir) belong to this group, so the app can write there.
        fsGroup: 10001
        # The container runtime's default list of allowed system calls.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jbh-iam
          # No tag here: the overlay sets it (kustomization.yaml "images:"), so one file lists every version.
          image: ghcr.io/kkpa-jbh/jbh-iam
          ports:
            - name: http
              containerPort: 9999
          # All keys of the ConfigMap become env vars.
          envFrom:
            - configMapRef:
                name: jbh-iam-config
          # Secrets, one key at a time. The Secret "jbh-secrets" is made by the overlay (secretGenerator).
          env:
            - name: JBH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jbh-secrets
                  key: JBH_JWT_SECRET
            # IAM's DB password variable. Same value as the Postgres password.
            - name: JBH_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: jbh-secrets
                  key: POSTGRES_PASSWORD
          # requests: what the scheduler reserves on a node. limits: the most the container may use.
          # The memory limit matches compose.yaml / compose.local.yaml (768M). Above it, the container is killed (OOMKilled).
          # No CPU limit on purpose: a CPU limit slows the JVM start a lot. The request still shares CPU fairly.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          # Container-level security, also required by the "restricted" standard.
          securityContext:
            allowPrivilegeEscalation: false
            # The image's files cannot change. Only the mounted volumes below are writable.
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Probes: HTTP calls the kubelet (the Kubernetes agent on the node) makes from outside the container.
          # So the image needs no curl or wget. Spring Boot turns these endpoints on by itself on Kubernetes.
          # startupProbe: runs first. Until it passes, the other two wait. A JVM start can take 1-2 minutes;
          #   5 s x 36 = 3 minutes before Kubernetes gives up (the same 3 minutes as ci-deploy.sh on the VPS).
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          # livenessProbe: "is the app stuck?" If it fails 3 times in a row, Kubernetes restarts the container.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # readinessProbe: "can it take traffic now?" While it fails, the Service sends it no requests.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            # The JVM and Tomcat write temp files. With a read-only root, /tmp must be a volume.
            - name: tmp
              mountPath: /tmp
      volumes:
        # emptyDir: an empty folder made when the pod starts and deleted with the pod. Nothing here must survive.
        - name: tmp
          emptyDir: {}
