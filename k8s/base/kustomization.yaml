# Kustomize "base": the Kubernetes objects of JBH that are the SAME on every target
# (the laptop now, the VPS in JBH-88, maybe AWS later).
#
# Rule (k8s/README.md, "Portability"): nothing here belongs to one target. No host name, no IP range,
# no storageClassName, no ingressClassName, no secret value. An overlay (k8s/overlays/<target>/) adds those.
#
# Render it:  kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/overlays/local
# (an overlay, not the base alone: the base has no image tags and no Secret).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every object below goes into the namespace "jbh" (a named area of the cluster, like a folder).
namespace: jbh

# A label on every object, so "kubectl get all -l app.kubernetes.io/part-of=jbh" finds all of JBH.
# includeSelectors: false -> do not add it to selectors (a Deployment's selector cannot change later).
labels:
  - pairs:
      app.kubernetes.io/part-of: jbh
    includeSelectors: false

resources:
  - namespace.yaml
  - ingress.yaml
  - jbh-iam/configmap.yaml
  - jbh-iam/deployment.yaml
  - jbh-iam/service.yaml
  - jbh-personal-finance/configmap.yaml
  - jbh-personal-finance/deployment.yaml
  - jbh-personal-finance/service.yaml
  - jbh-notification/configmap.yaml
  - jbh-notification/deployment.yaml
  - jbh-notification/service.yaml
  - jbh-gateway/configmap.yaml
  - jbh-gateway/discovery-configmap.yaml
  - jbh-gateway/deployment.yaml
  - jbh-gateway/service.yaml
  - jbh-web/deployment.yaml
  - jbh-web/service.yaml
