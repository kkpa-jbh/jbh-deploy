apiVersion: 1
groups:
  - orgId: 1
    name: jbh-frontend
    folder: JBH
    interval: 1m
    rules:
      - uid: jbh-alert-frontend-errors
        title: JBH frontend exceptions above 10 in 5 minutes
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              expr: 'sum(count_over_time({service_name="jbh-web"} |= "kind=exception" [5m]))'
              queryType: range
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 10
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "The browser app reports more than 10 exceptions in 5 minutes."
          description: "Faro exception lines (kind=exception) of jbh-web counted in Loki. Needs the Faro service.name step in local.alloy: before it, these lines show service_name=\"unknown_service\". No lines means no data, which is fine."
          what_to_check_first: "Explore, Loki: {service_name=\"jbh-web\"} |= \"kind=exception\". Open one line: the traceID field leads to the backend trace in Explore, Tempo. Dashboard jbh-overview (panel Frontend errors)."
        labels:
          severity: warning
          service: jbh
