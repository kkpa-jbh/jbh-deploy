# Deployment for jbh-notification: keeps one pod of the service running.
# Same shape as jbh-iam/deployment.yaml; read that file for why each setting is there.
# GMAIL_APP_PASSWORD is required: the Quarkus prod profile does not start without a value (a placeholder is fine;
# then only sending an email fails).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jbh-notification
  labels:
    app.kubernetes.io/name: jbh-notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jbh-notification
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jbh-notification
    spec:
      automountServiceAccountToken: false
      # No Service env vars (they would clash with app properties). Names come from DNS.
      enableServiceLinks: false
      # Required by the "restricted" Pod Security Standard. 10001 = the image's numeric user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jbh-notification
          # The tag comes from the overlay ("images:" in its kustomization.yaml).
          image: ghcr.io/kkpa-jbh/jbh-notification
          ports:
            - name: http
              containerPort: 7778
          envFrom:
            - configMapRef:
                name: jbh-notification-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jbh-secrets
                  key: POSTGRES_PASSWORD
            - name: GMAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jbh-secrets
                  key: GMAIL_USERNAME
                  # Optional: an empty or missing key is fine, the feature is just off.
                  optional: true
            - name: GMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: jbh-secrets
                  key: GMAIL_FROM
                  # Optional: an empty or missing key is fine, the feature is just off.
                  optional: true
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jbh-secrets
                  key: GMAIL_APP_PASSWORD
          # Memory limit = the one in compose.local.yaml. No CPU limit: it would slow the JVM start.
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # startup: up to 5 s x 36 = 3 minutes for the JVM start. liveness: restart if stuck. readiness: traffic only when ready.
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            # Temp files of the JVM. The root file system is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
