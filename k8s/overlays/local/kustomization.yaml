# Kustomize "overlay" for the LOCAL cluster (k3d on a laptop): the base + Postgres + the laptop-only values.
# A later target (the VPS in JBH-88, maybe AWS) gets its own overlay folder next to this one; the base stays the same.
#
# Render it (prints the final YAML; it starts nothing):
#   kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/overlays/local     (or: make k8s-render)
# Apply it to the cluster: make k8s-up (see LOCAL-K8S.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The same namespace as the base. Needed here too: the Secret and the Postgres objects are made at this level,
# and Kustomize links names (jbh-secrets -> jbh-secrets-<hash>) only between objects in the same namespace.
# The PersistentVolume belongs to no namespace; Kustomize leaves it alone.
namespace: jbh

resources:
  - ../../base
  # A fixed disk for Postgres, so the data survives "make k8s-down" (see the file).
  - postgres-pv.yaml

components:
  # Postgres runs inside the local cluster.
  - ../../components/postgres
  # Traces, logs and metrics to the local LGTM (kkpa-docker-lab), through an Alloy in the cluster.
  # Remove this line to turn it all off (LOCAL-K8S.md, "Turn it all off": running objects need a delete too).
  # It must come after postgres: it patches the Postgres objects.
  - ../../components/observability

# The image version of each service, in one place. Changing a tag here and applying it starts a rollout:
# Kubernetes replaces the pods one by one with the new image.
# "make k8s-pin" (scripts/k8s-pin.sh) writes the newest git SHA of each image into the newTag lines.
# Use a SHA, not "latest": with "latest" Kubernetes cannot see that a new image exists, and you cannot tell what runs.
images:
  - name: ghcr.io/kkpa-jbh/jbh-iam
    newTag: 88af4f96ac7fb29bd055184cc0066b6e593a08d3
  - name: ghcr.io/kkpa-jbh/jbh-personal-finance
    newTag: 9c175780131233662f124460619dd6bbacbff4d6
  - name: ghcr.io/kkpa-jbh/jbh-notification
    newTag: 0dbc74d2e90cfeca98e1ec518215fcb484f1aee6
  - name: ghcr.io/kkpa-jbh/jbh-gateway
    newTag: aec73579b8e1ee9599de82f223c0def8be8ea2d3
  - name: ghcr.io/kkpa-jbh/jbh-web
    newTag: c1223e45319bfcd640e1a444afb1c114f846a646

# Target-only values of the observability component: where Alloy sends the data (the LGTM on the laptop,
# through host.k3d.internal), and the browser's Faro settings (collector on the same origin as the app).
configMapGenerator:
  - name: jbh-alloy-entry
    files:
      - config.alloy=../../../observability/alloy/k8s-local.alloy
  - name: jbh-web-runtime
    files:
      - runtime-config.js=jbh-web-runtime-config.js

# Makes the Secret "jbh-secrets" from the file .env.k8s (KEY=value lines, git-ignored, never committed).
# Copy .env.k8s.example to .env.k8s and fill it. Kustomize adds a hash to the Secret's name and updates every
# reference, so a changed secret restarts the pods that use it.
secretGenerator:
  - name: jbh-secrets
    envs:
      - .env.k8s

patches:
  # Which Ingress controller applies the rules: Traefik, built into k3s.
  - path: patches/ingress-traefik.yaml
  # The same for the Faro route (/collect -> jbh-alloy) of the observability component.
  # A target, not only the name in the file: a target that finds nothing is skipped, so the overlay still
  # renders when the component is turned off.
  - path: patches/ingress-traefik-faro.yaml
    target:
      kind: Ingress
      name: jbh-faro
  # jbh-iam: the "local" profile (HTTP cookies) and a place for its log file.
  - path: patches/jbh-iam-config.yaml
  - path: patches/jbh-iam-logs.yaml
  # The gateway: the "local" profile and the trusted proxy range.
  - path: patches/jbh-gateway-config.yaml
  # The link in invitation emails.
  - path: patches/jbh-notification-config.yaml
  # The environment label, for every Java service.
  - path: patches/jbh-personal-finance-config.yaml
  # Pull the private GHCR images with the Secret "jbh-ghcr-pull" (made by make k8s-ghcr-secret).
  # It targets every Deployment, so a new service gets it without a change here.
  - path: patches/image-pull-secret.yaml
    target:
      kind: Deployment
  # Postgres: use the fixed local disk (postgres-pv.yaml) instead of a new empty one.
  - path: patches/postgres-local-disk.yaml
    target:
      kind: StatefulSet
      name: jbh-postgres
