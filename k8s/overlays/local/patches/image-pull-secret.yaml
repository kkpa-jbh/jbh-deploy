# The GHCR images are private. Every Deployment pulls with the Secret "jbh-ghcr-pull".
# "make k8s-ghcr-secret" (scripts/k8s-ghcr-secret.sh) creates it from a token; it is never in git.
# The kubelet reads the Secret on every pull, so a renewed token works without a new rollout.
- op: add
  path: /spec/template/spec/imagePullSecrets
  value:
    - name: jbh-ghcr-pull
