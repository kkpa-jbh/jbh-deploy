apiVersion: 1
groups:
  - orgId: 1
    name: jbh-postgres
    folder: JBH
    interval: 1m
    rules:
      - uid: jbh-alert-pg-deadlock
        title: JBH Postgres deadlock
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'sum(increase(pg_stat_database_deadlocks{service="jbh-postgres"}[5m]))'
              instant: false
              range: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Postgres detected at least one deadlock in the last 5 minutes."
          description: "pg_stat_database_deadlocks grew in the last 5 minutes. Two transactions waited for each other and Postgres cancelled one."
          what_to_check_first: "Dashboard jbh-postgres (panels deadlocks, locks by mode, top queries). Then the Postgres log: docker logs jbh-local-jbh-postgres-1 and search for deadlock detected. Find the service in Loki: {service_name=~\"jbh-.+\"} |= \"deadlock\"."
        labels:
          severity: warning
          service: jbh
