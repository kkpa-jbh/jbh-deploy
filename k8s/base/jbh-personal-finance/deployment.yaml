# Deployment for jbh-personal-finance: keeps one pod of the service running.
# Same shape as jbh-iam/deployment.yaml; read that file for why each setting is there.
# Quarkus health paths: /q/health/started, /live, /ready (extension quarkus-smallrye-health).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jbh-personal-finance
  labels:
    app.kubernetes.io/name: jbh-personal-finance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jbh-personal-finance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jbh-personal-finance
    spec:
      automountServiceAccountToken: false
      # No Service env vars (they would clash with app properties). Names come from DNS.
      enableServiceLinks: false
      # Required by the "restricted" Pod Security Standard. 10001 = the image's numeric user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jbh-personal-finance
          # The tag comes from the overlay ("images:" in its kustomization.yaml).
          image: ghcr.io/kkpa-jbh/jbh-personal-finance
          ports:
            - name: http
              containerPort: 7777
          envFrom:
            - configMapRef:
                name: jbh-personal-finance-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jbh-secrets
                  key: POSTGRES_PASSWORD
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jbh-secrets
                  key: OPENROUTER_API_KEY
                  # Optional: an empty or missing key is fine, the feature is just off.
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jbh-secrets
                  key: GEMINI_API_KEY
                  # Optional: an empty or missing key is fine, the feature is just off.
                  optional: true
            - name: JEV_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jbh-secrets
                  key: JEV_API_KEY
                  # Optional: an empty or missing key is fine, the feature is just off.
                  optional: true
            - name: AZURE_DI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: jbh-secrets
                  key: AZURE_DI_ENDPOINT
                  # Optional: an empty or missing key is fine, the feature is just off.
                  optional: true
            - name: AZURE_DI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jbh-secrets
                  key: AZURE_DI_API_KEY
                  # Optional: an empty or missing key is fine, the feature is just off.
                  optional: true
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jbh-secrets
                  key: OLLAMA_API_KEY
                  # Optional: an empty or missing key is fine, the feature is just off.
                  optional: true
          # Memory limit = the one in compose.local.yaml. No CPU limit: it would slow the JVM start.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # startup: up to 5 s x 36 = 3 minutes for the JVM start. liveness: restart if stuck. readiness: traffic only when ready.
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            # Temp files of the JVM. The root file system is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
